<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Akcija — Zloćudovo</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='48' fill='%232b2015'/%3E%3Ccircle cx='50' cy='50' r='30' fill='%23c08a3e'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="akcija.css">
</head>
<body>

<header class="nav">
  <div class="nav-mark">Zloćudovo</div>
  <a class="back-link" href="../index.html#akcije">← Nazad na akcije</a>
</header>

<div id="sadrzaj">
  <p class="akcija-loading">Učitavanje…</p>
</div>

<footer>
  <p>Zloćudovo · Grad Leskovac · Jablanički okrug</p>
</footer>

<script src="/js/akcije-shared.js"></script>
<script>
(function(){
  var Z = window.ZlocudovoAkcije;
  var el = document.getElementById('sadrzaj');
  var slug = new URLSearchParams(window.location.search).get('slug');

  function paragraphs(text){
    return String(text || '')
      .split(/\n\s*\n/)
      .filter(function(block){ return block.trim().length; })
      .map(function(block){ return '<p>' + Z.escapeHtml(block.trim()).replace(/\n/g, '<br>') + '</p>'; })
      .join('');
  }

  function notFound(){
    document.title = 'Akcija nije pronađena — Zloćudovo';
    el.innerHTML =
      '<section class="akcija-hero"><div class="akcija-hero-inner">' +
        '<h1>Akcija nije pronađena</h1>' +
        '<p class="lede"><a href="../index.html#akcije" style="color:inherit">← Nazad na sve akcije</a></p>' +
      '</div></section>';
  }

  if(!slug || !Z){
    notFound();
    return;
  }

  Z.fetchAkcije().then(function(items){
    var item = items.filter(function(it){ return Z.slugFor(it) === slug; })[0];
    if(!item){
      notFound();
      return;
    }
    document.title = item.naslov + ' (' + item.godina + ') — Zloćudovo';

    function sizeClass(v){ return (v === 'mala' || v === 'velika') ? v : 'srednja'; }

    function mediaBlock(velicina, inner, extraClass){
      return '<div class="akcija-media-block size-' + sizeClass(velicina) + (extraClass ? ' ' + extraClass : '') + '">' + inner + '</div>';
    }

    function mediaRow(pos, velicina, mediaInner, textHtml){
      var p = (pos === 'right') ? 'right' : 'left';
      return '<div class="akcija-media-row pos-' + p + ' size-' + sizeClass(velicina) + '">' +
        '<div class="akcija-media-slot">' + mediaInner + '</div>' +
        '<div class="akcija-text-slot">' + textHtml + '</div>' +
      '</div>';
    }

    function captionHtml(text){
      return text ? '<p class="slideshow-note">' + Z.escapeHtml(text) + '</p>' : '';
    }

    var imgInner = item.slika
      ? '<img class="akcija-hero-img" src="' + Z.escapeHtml(item.slika) + '" alt="' + Z.escapeHtml(item.naslov) + '">' + captionHtml(item.opis_slike)
      : '';

    var galerija = Array.isArray(item.galerija)
      ? item.galerija.map(function(g){ return typeof g === 'string' ? g : (g && g.slika); }).filter(Boolean)
      : [];
    var galleryInner = '';
    if(galerija.length){
      var slides = galerija.map(function(src, i){
        return '<div class="slide' + (i === 0 ? ' active' : '') + '"><img src="' + Z.escapeHtml(src) + '" alt="' + Z.escapeHtml(item.naslov) + '"></div>';
      }).join('');
      var controls = galerija.length > 1
        ? '<button type="button" class="slide-nav prev" aria-label="Prethodna slika">‹</button>' +
          '<button type="button" class="slide-nav next" aria-label="Sledeća slika">›</button>' +
          '<div class="slide-dots"></div>'
        : '';
      galleryInner = '<div class="slideshow" id="akcijaSlideshow">' + slides + controls + '</div>' + captionHtml(item.opis_galerije);
    }

    var izgled = item.izgled || 'top';
    var izgledG = item.izgled_galerije || 'top';
    var textHtml = paragraphs(item.tekst);

    var pre = [];   // blokovi pre teksta
    var post = [];  // blokovi posle teksta (npr. galerija na kraju)
    var rowUsed = false;

    if(imgInner && (izgled === 'left' || izgled === 'right')){
      textHtml = mediaRow(izgled, item.velicina_slike, imgInner, textHtml);
      rowUsed = true;
    } else if(imgInner && izgled === 'top'){
      pre.push(mediaBlock(item.velicina_slike, imgInner));
    }
    // izgled === 'none' -> slika se ne prikazuje

    if(galleryInner){
      if(!rowUsed && (izgledG === 'left' || izgledG === 'right')){
        textHtml = mediaRow(izgledG, item.velicina_galerije, galleryInner, textHtml);
        rowUsed = true;
      } else if(izgledG === 'end'){
        post.push(mediaBlock(item.velicina_galerije, galleryInner, 'akcija-gallery pos-end'));
      } else {
        pre.push(mediaBlock(item.velicina_galerije, galleryInner, 'akcija-gallery'));
      }
    }

    el.innerHTML =
      '<section class="akcija-hero"><div class="akcija-hero-inner">' +
        '<span class="yr">' + Z.escapeHtml(item.godina) + '</span>' +
        '<h1>' + Z.escapeHtml(item.naslov) + '</h1>' +
        '<p class="lede">' + Z.escapeHtml(item.opis || '') + '</p>' +
      '</div></section>' +
      '<article class="akcija-body">' +
        pre.join('') +
        textHtml +
        post.join('') +
        '<div class="akcija-nav-between"><a href="../index.html#akcije">← Sve akcije</a></div>' +
      '</article>';

    initSlideshow();
  });

  function initSlideshow(){
    var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var wrap = document.getElementById('akcijaSlideshow');
    if(!wrap) return;
    var slides = Array.prototype.slice.call(wrap.querySelectorAll('.slide'));
    var dotsWrap = wrap.querySelector('.slide-dots');
    if(!dotsWrap || slides.length < 2) return;
    var idx = 0;

    slides.forEach(function(_, i){
      var b = document.createElement('button');
      b.type = 'button';
      if(i === 0) b.className = 'active';
      b.setAttribute('aria-label', 'Slika ' + (i + 1));
      b.addEventListener('click', function(){ goTo(i); });
      dotsWrap.appendChild(b);
    });
    var dots = Array.prototype.slice.call(dotsWrap.querySelectorAll('button'));

    function goTo(i){
      slides[idx].classList.remove('active');
      dots[idx].classList.remove('active');
      idx = (i + slides.length) % slides.length;
      slides[idx].classList.add('active');
      dots[idx].classList.add('active');
    }

    wrap.querySelector('.prev').addEventListener('click', function(){ goTo(idx - 1); });
    wrap.querySelector('.next').addEventListener('click', function(){ goTo(idx + 1); });

    if(!reduce){
      setInterval(function(){ goTo(idx + 1); }, 4500);
    }
  }
})();
</script>

</body>
</html>
