backend:
  name: git-gateway
  branch: master

media_folder: "images/uploads"
public_folder: "/images/uploads"

locale: "sr"

collections:
  - name: "akcije"
    label: "Akcije"
    files:
      - name: "spisak"
        label: "Spisak akcija"
        file: "data/akcije.json"
        fields:
          - label: "Akcije"
            name: "akcije"
            widget: "list"
            label_singular: "Akcija"
            summary: "{{godina}} — {{naslov}}"
            fields:
              - label: "Godina"
                name: "godina"
                widget: "string"
                hint: "Unesi godinu u formatu GGGG, npr. 2026"
                pattern: ["^[0-9]{4}$", "Godina mora imati tačno 4 cifre, npr. 2026"]
              - label: "Naslov"
                name: "naslov"
                widget: "string"
              - label: "Kratak opis"
                name: "opis"
                widget: "text"
                hint: "Prikazuje se na kartici na početnoj strani, u okviru vremenske linije"
              - label: "Raspored glavne slike"
                name: "izgled"
                widget: "select"
                default: "top"
                options:
                  - { label: "Slika iznad teksta", value: "top" }
                  - { label: "Slika levo od teksta", value: "left" }
                  - { label: "Slika desno od teksta", value: "right" }
                  - { label: "Bez glavne slike", value: "none" }
              - label: "Glavna slika"
                name: "slika"
                widget: "image"
                required: false
                hint: "Opciono. Raspored biraš u polju iznad."
              - label: "Veličina glavne slike"
                name: "velicina_slike"
                widget: "select"
                default: "srednja"
                required: false
                options:
                  - { label: "Mala", value: "mala" }
                  - { label: "Srednja", value: "srednja" }
                  - { label: "Velika (puna širina)", value: "velika" }
              - label: "Opis slike"
                name: "opis_slike"
                widget: "string"
                required: false
                hint: "Kratak tekst ispod glavne slike (opciono)"
              - label: "Tekst"
                name: "tekst"
                widget: "text"
                hint: "Pun tekst akcije. Prazan red između redova pravi novi pasus."
              - label: "Galerija (slajd šou, opciono)"
                name: "galerija"
                widget: "image"
                required: false
                hint: "Klikni 'Choose an image', pa u galeriji medija drži Ctrl (ili Cmd na Mac-u) i klikni da izabereš više slika odjednom — isto tako možeš i da uploaduješ više fajlova odjednom. 2+ slike prikazuju se kao slajd šou."
                media_library:
                  config:
                    multiple: true
                    max_files: 20
              - label: "Raspored galerije"
                name: "izgled_galerije"
                widget: "select"
                default: "top"
                required: false
                options:
                  - { label: "Galerija iznad teksta", value: "top" }
                  - { label: "Galerija levo od teksta", value: "left" }
                  - { label: "Galerija desno od teksta", value: "right" }
                  - { label: "Galerija na kraju teksta", value: "end" }
              - label: "Veličina galerije"
                name: "velicina_galerije"
                widget: "select"
                default: "srednja"
                required: false
                options:
                  - { label: "Mala", value: "mala" }
                  - { label: "Srednja", value: "srednja" }
                  - { label: "Velika (puna širina)", value: "velika" }
              - label: "Opis galerije"
                name: "opis_galerije"
                widget: "string"
                required: false
                hint: "Kratak tekst ispod galerije/slajd šoua (opciono)"

  - name: "najave"
    label: "Najave"
    files:
      - name: "spisak"
        label: "Spisak najava"
        file: "data/najave.json"
        fields:
          - label: "Najave"
            name: "najave"
            widget: "list"
            label_singular: "Najava"
            summary: "{{naslov}}"
            fields:
              - label: "Prikaži na sajtu"
                name: "aktivna"
                widget: "boolean"
                default: false
                hint: "Uključi samo za JEDNU najavu — ta će se prikazivati u odeljku „Najave” na sajtu."
              - label: "Naslov"
                name: "naslov"
                widget: "string"
                default: "Sledeća akcija"
              - label: "Tekst"
                name: "tekst"
                widget: "text"
