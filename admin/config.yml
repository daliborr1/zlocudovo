backend:
  name: git-gateway
  branch: master

publish_mode: editorial_workflow

media_folder: "images/uploads"
public_folder: "/images/uploads"

locale: "sr"

collections:
  - name: "akcije"
    label: "Akcije"
    folder: "content/akcije"
    create: true
    slug: "{{godina}}-{{slug}}"
    identifier_field: "naslov"
    summary: "{{godina}} — {{naslov}}"
    extension: "json"
    format: "json"
    fields:
      - label: "Godina"
        name: "godina"
        widget: "string"
        hint: "Unesi godinu u formatu GGGG, npr. 2026"
        pattern: ["^[0-9]{4}$", "Godina mora imati tačno 4 cifre, npr. 2026"]
      - label: "Naslov"
        name: "naslov"
        widget: "string"
      - label: "Kratak opis"
        name: "opis"
        widget: "markdown"
        hint: "Prikazuje se na kartici na početnoj strani i u zaglavlju stranice akcije."
        buttons: ["bold", "italic", "link"]
        modes: ["rich_text"]
      - label: "Glavna slika"
        name: "glavna_slika"
        widget: "object"
        collapsed: true
        summary: "{{fields.izgled}}"
        fields:
          - label: "Raspored"
            name: "izgled"
            widget: "select"
            default: "top"
            required: false
            options:
              - { label: "Slika iznad teksta", value: "top" }
              - { label: "Slika levo od teksta", value: "left" }
              - { label: "Slika desno od teksta", value: "right" }
              - { label: "Bez glavne slike", value: "none" }
          - label: "Slika"
            name: "slika"
            widget: "image"
            required: false
          - label: "Veličina"
            name: "velicina_slike"
            widget: "select"
            default: "srednja"
            required: false
            options:
              - { label: "Mala", value: "mala" }
              - { label: "Srednja", value: "srednja" }
              - { label: "Velika (puna širina)", value: "velika" }
          - label: "Opis slike"
            name: "opis_slike"
            widget: "markdown"
            required: false
            hint: "Kratak tekst ispod slike (opciono)"
            buttons: ["bold", "italic", "link"]
            modes: ["rich_text"]
      - label: "Tekst"
        name: "tekst"
        widget: "markdown"
        hint: "Podebljano, kurziv, naslovi, liste, citat, linkovi i slike ubačene direktno u tekst. Prazan red pravi novi pasus."
        buttons: ["bold", "italic", "link", "heading-two", "heading-three", "quote", "bulleted-list", "numbered-list"]
        editor_components: ["image"]
      - label: "Galerija (slajd šou)"
        name: "galerija_grupa"
        widget: "object"
        collapsed: true
        summary: "{{fields.izgled_galerije}}"
        fields:
          - label: "Slike"
            name: "galerija"
            widget: "image"
            required: false
            hint: "Klikni 'Choose an image', pa u galeriji medija drži Ctrl (ili Cmd na Mac-u) i klikni da izabereš više slika odjednom — isto tako možeš i da uploaduješ više fajlova odjednom. 2+ slike prikazuju se kao slajd šou."
            media_library:
              config:
                multiple: true
                max_files: 20
          - label: "Raspored"
            name: "izgled_galerije"
            widget: "select"
            default: "top"
            required: false
            options:
              - { label: "Galerija iznad teksta", value: "top" }
              - { label: "Galerija levo od teksta", value: "left" }
              - { label: "Galerija desno od teksta", value: "right" }
              - { label: "Galerija na kraju teksta", value: "end" }
          - label: "Veličina"
            name: "velicina_galerije"
            widget: "select"
            default: "srednja"
            required: false
            options:
              - { label: "Mala", value: "mala" }
              - { label: "Srednja", value: "srednja" }
              - { label: "Velika (puna širina)", value: "velika" }
          - label: "Opis galerije"
            name: "opis_galerije"
            widget: "markdown"
            required: false
            hint: "Kratak tekst ispod galerije/slajd šoua (opciono)"
            buttons: ["bold", "italic", "link"]
            modes: ["rich_text"]

  - name: "najave"
    label: "Najave"
    folder: "content/najave"
    create: true
    slug: "{{slug}}"
    identifier_field: "naslov"
    summary: "{{naslov}}"
    extension: "json"
    format: "json"
    fields:
      - label: "Prikaži na sajtu"
        name: "aktivna"
        widget: "boolean"
        default: false
        hint: "Uključi samo za JEDNU najavu — ta će se prikazivati u odeljku „Najave” na sajtu."
      - label: "Naslov"
        name: "naslov"
        widget: "string"
        default: "Sledeća akcija"
      - label: "Tekst"
        name: "tekst"
        widget: "markdown"
        hint: "Podebljano, kurziv, naslovi, liste, citat, linkovi. Prazan red pravi novi pasus."
        buttons: ["bold", "italic", "link", "heading-two", "heading-three", "quote", "bulleted-list", "numbered-list"]
      - label: "Glavna slika"
        name: "glavna_slika"
        widget: "object"
        collapsed: true
        required: false
        summary: "{{fields.izgled}}"
        fields:
          - label: "Raspored"
            name: "izgled"
            widget: "select"
            default: "top"
            required: false
            options:
              - { label: "Slika iznad teksta", value: "top" }
              - { label: "Slika levo od teksta", value: "left" }
              - { label: "Slika desno od teksta", value: "right" }
              - { label: "Bez slike", value: "none" }
          - label: "Slika"
            name: "slika"
            widget: "image"
            required: false
          - label: "Veličina"
            name: "velicina_slike"
            widget: "select"
            default: "srednja"
            required: false
            options:
              - { label: "Mala", value: "mala" }
              - { label: "Srednja", value: "srednja" }
              - { label: "Velika (puna širina)", value: "velika" }
          - label: "Opis slike"
            name: "opis_slike"
            widget: "markdown"
            required: false
            hint: "Kratak tekst ispod slike (opciono)"
            buttons: ["bold", "italic", "link"]
            modes: ["rich_text"]


  - name: "familija-galerija"
    label: "Familija — Galerija"
    folder: "content/familija-galerija"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{hour}}{{minute}}{{second}}-{{slug}}"
    identifier_field: "opis"
    summary: "{{opis}}"
    extension: "json"
    format: "json"
    fields:
      - label: "Slika"
        name: "slika"
        widget: "image"
      - label: "Opis"
        name: "opis"
        widget: "string"
        hint: "Prikazuje se preko slike u slajd šou-u (sekcija „Omladinski pokret Familija”)."

  - name: "akcije-galerija"
    label: "Akcije — Galerija"
    folder: "content/akcije-galerija"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{hour}}{{minute}}{{second}}-{{slug}}"
    identifier_field: "opis"
    summary: "{{opis}}"
    extension: "json"
    format: "json"
    fields:
      - label: "Slika"
        name: "slika"
        widget: "image"
      - label: "Opis"
        name: "opis"
        widget: "string"
        hint: "Prikazuje se preko slike u slajd šou-u (sekcija „Akcije za selo, kroz godine”)."


  - name: "turnir"
    label: "Turnir"
    files:
      - name: "podesavanja"
        label: "Podešavanja turnira"
        file: "data/turnir-podesavanja.json"
        fields:
          - label: "Aktivan (prikaži na sajtu)"
            name: "aktivan"
            widget: "boolean"
            default: false
            hint: "Uključi da bi se kartica turnira pojavila na početnoj strani, iznad „O selu”."
          - label: "Naziv turnira"
            name: "naziv"
            widget: "string"
            default: "Turnir u košarci"
          - label: "Opis"
            name: "opis"
            widget: "markdown"
            required: false
            buttons: ["bold", "italic", "link"]
            modes: ["rich_text"]
          - label: "Sport"
            name: "sport"
            widget: "string"
            default: "Košarka"
            required: false
          - label: "Format"
            name: "format"
            widget: "string"
            default: "Kup sistem"
            required: false
          - label: "Datum"
            name: "datum"
            widget: "string"
            default: "TBA"
            required: false
          - label: "Broj ekipa"
            name: "broj_ekipa"
            widget: "number"
            value_type: "int"
            required: false
          - label: "Status"
            name: "status"
            widget: "select"
            default: "Uskoro"
            options: ["Uskoro", "Pretkolo u toku", "U toku", "Finale u toku", "Turnir završen"]
          - label: "Prikaži pobednika"
            name: "prikazi_pobednika"
            widget: "boolean"
            default: false
            hint: "Uključi tek kad se turnir završi."
          - label: "Naziv pobedničkog tima"
            name: "pobednik_naziv"
            widget: "string"
            required: false
          - label: "Slika pobednika"
            name: "pobednik_slika"
            widget: "image"
            required: false
          - label: "Čestitka"
            name: "pobednik_cestitka"
            widget: "markdown"
            required: false
            hint: "Kratka čestitka ili poruka pobedničkom timu (opciono)."
            buttons: ["bold", "italic", "link"]
            modes: ["rich_text"]
          - label: "Prikaži sponzore"
            name: "prikazi_sponzore"
            widget: "boolean"
            default: false

  - name: "turnir-utakmice"
    label: "Turnir — Utakmice"
    folder: "content/turnir-utakmice"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{hour}}{{minute}}{{second}}-{{slug}}"
    identifier_field: "tim1"
    summary: "{{runda}} — {{tim1}} : {{tim2}}"
    extension: "json"
    format: "json"
    fields:
      - label: "Runda"
        name: "runda"
        widget: "select"
        default: "Grupna faza"
        options: ["Grupna faza", "Pretkolo", "1/16 finala", "Osmina finala", "Četvrtfinale", "Polufinale", "Finale"]
      - label: "Tim 1"
        name: "tim1"
        widget: "string"
      - label: "Tim 2"
        name: "tim2"
        widget: "string"
        required: false
        hint: "Ostavi prazno ako je Tim 1 slobodan (bye) u ovoj rundi."
      - label: "Rezultat — Tim 1"
        name: "rezultat1"
        widget: "number"
        value_type: "int"
        required: false
      - label: "Rezultat — Tim 2"
        name: "rezultat2"
        widget: "number"
        value_type: "int"
        required: false
      - label: "Datum"
        name: "datum"
        widget: "string"
        required: false
      - label: "Vreme"
        name: "vreme"
        widget: "string"
        required: false
      - label: "Teren / lokacija"
        name: "teren"
        widget: "string"
        required: false

  - name: "turnir-novosti"
    label: "Turnir — Novosti"
    folder: "content/turnir-novosti"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{hour}}{{minute}}{{second}}-{{slug}}"
    identifier_field: "naslov"
    summary: "{{naslov}}"
    extension: "json"
    format: "json"
    fields:
      - label: "Datum"
        name: "datum"
        widget: "string"
        required: false
      - label: "Naslov"
        name: "naslov"
        widget: "string"
      - label: "Tekst"
        name: "tekst"
        widget: "markdown"
        buttons: ["bold", "italic", "link", "heading-two", "heading-three", "quote", "bulleted-list", "numbered-list"]

  - name: "turnir-sponzori"
    label: "Turnir — Sponzori"
    folder: "content/turnir-sponzori"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{hour}}{{minute}}{{second}}-{{slug}}"
    identifier_field: "naziv"
    summary: "{{naziv}}"
    extension: "json"
    format: "json"
    fields:
      - label: "Naziv sponzora"
        name: "naziv"
        widget: "string"
      - label: "Logo"
        name: "logo"
        widget: "image"
      - label: "Link"
        name: "link"
        widget: "string"
        required: false
